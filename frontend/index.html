<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>anomaly-agent Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #e6edf3;
      padding: 2rem;
      max-width: 900px;
      margin: 0 auto;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
    .subtitle { color: #8b949e; margin-bottom: 2rem; font-size: 0.9rem; }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .card h2 { font-size: 1rem; margin-bottom: 1rem; color: #58a6ff; }
    button {
      background: #238636;
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      margin-right: 0.5rem;
      margin-bottom: 0.5rem;
    }
    button:hover { background: #2ea043; }
    button:disabled { background: #30363d; cursor: not-allowed; opacity: 0.6; }
    .status { font-size: 0.85rem; color: #8b949e; margin-top: 0.5rem; }
    .anomaly { color: #f85149; font-weight: 600; }
    .normal { color: #3fb950; font-weight: 600; }
    .hint { font-size: 0.75rem; color: #6e7681; margin-top: 0.5rem; }
    pre {
      background: #0d1117;
      padding: 1rem;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 0.8rem;
      white-space: pre-wrap;
      word-break: break-word;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <h1>anomaly-agent</h1>
  <p class="subtitle">Zero-trust anomaly detection for distributed systems</p>

  <div class="card">
    <h2>Test Detection</h2>
    <p style="font-size:0.85rem;color:#8b949e;margin-bottom:1rem;">
      The model is trained at server startup. Click below to test.
    </p>
    <button id="normalBtn" onclick="detect('normal')">Send Normal Snapshot</button>
    <button id="anomalyBtn" onclick="detect('anomaly')">Send Anomalous Snapshot</button>
    <div class="status" id="detectStatus"></div>
    <div class="hint" id="coldStartHint" style="display:none;">
      First request may take up to 50 seconds if the server was idle. Please wait...
    </div>
    <pre id="detectOutput" style="display:none;"></pre>
  </div>

  <script>
    const API_URL = "https://anomaly-agent-lwvs.onrender.com";

    async function fetchWithTimeout(url, options, timeoutMs = 70000) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const res = await fetch(url, { ...options, signal: controller.signal });
        return res;
      } finally {
        clearTimeout(timer);
      }
    }

    async function detect(kind) {
      const status = document.getElementById("detectStatus");
      const output = document.getElementById("detectOutput");
      const hint = document.getElementById("coldStartHint");

      status.textContent = "Checking...";
      output.style.display = "none";
      hint.style.display = "block";

      try {
        const res = await fetchWithTimeout(`${API_URL}/demo/${kind}`, {
          method: "GET",
        });
        const data = await res.json();

        if (data.error) {
          status.textContent = `Error: ${data.error}`;
          return;
        }

        status.innerHTML = data.is_anomaly
          ? `<span class="anomaly">ANOMALY DETECTED</span> (score: ${data.score.toFixed(4)})`
          : `<span class="normal">Normal</span> (score: ${data.score.toFixed(4)})`;

        if (data.alert) {
          output.textContent = data.alert;
          output.style.display = "block";
        }
      } catch (e) {
        status.textContent = `Failed: ${e.name === "AbortError" ? "Server timeout. Try again." : "Network error."}`;
      } finally {
        hint.style.display = "none";
      }
    }
  </script>
</body>
</html>
