<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>anomaly-agent Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #e6edf3;
      padding: 2rem;
      max-width: 900px;
      margin: 0 auto;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
    .subtitle { color: #8b949e; margin-bottom: 2rem; font-size: 0.9rem; }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .card h2 { font-size: 1rem; margin-bottom: 1rem; color: #58a6ff; }
    button {
      background: #238636;
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      margin-right: 0.5rem;
      margin-bottom: 0.5rem;
    }
    button:hover { background: #2ea043; }
    button:disabled { background: #30363d; cursor: not-allowed; }
    .status { font-size: 0.85rem; color: #8b949e; margin-top: 0.5rem; }
    .anomaly { color: #f85149; font-weight: 600; }
    .normal { color: #3fb950; font-weight: 600; }
    pre {
      background: #0d1117;
      padding: 1rem;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 0.8rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <h1>anomaly-agent</h1>
  <p class="subtitle">Zero-trust anomaly detection for distributed systems</p>

  <div class="card">
    <h2>1. Train on Baseline</h2>
    <p style="font-size:0.85rem;color:#8b949e;margin-bottom:1rem;">
      Send normal snapshots to teach the detector what "normal" looks like.
    </p>
    <button onclick="train()">Train Model</button>
    <div class="status" id="trainStatus"></div>
  </div>

  <div class="card">
    <h2>2. Detect Anomaly</h2>
    <p style="font-size:0.85rem;color:#8b949e;margin-bottom:1rem;">
      Send a new snapshot to see if it's normal or anomalous.
    </p>
    <button onclick="detect(false)">Send Normal Snapshot</button>
    <button onclick="detect(true)">Send Anomalous Snapshot</button>
    <div class="status" id="detectStatus"></div>
    <pre id="detectOutput" style="margin-top:1rem;display:none;"></pre>
  </div>

  <script>
    // IMPORTANT: Replace this with your actual Render backend URL after deploying
    const API_URL = "https://anomaly-agent.onrender.com";

    function makeSnapshot(anomalous) {
      return {
        timestamp: new Date().toISOString(),
        cpu_percent: anomalous ? 95.0 : 10.0,
        memory_percent: anomalous ? 90.0 : 40.0,
        disk_percent: 50.0,
        net_sent_mb: anomalous ? 500.0 : 1.0,
        net_recv_mb: anomalous ? 800.0 : 2.0,
      };
    }

    async function train() {
      const status = document.getElementById("trainStatus");
      status.textContent = "Training...";
      // Create 50 normal snapshots
      const snapshots = Array.from({ length: 50 }, () => makeSnapshot(false));
      try {
        const res = await fetch(`${API_URL}/train`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ snapshots }),
        });
        const data = await res.json();
        status.textContent = data.error ? `Error: ${data.error}` : `Trained on ${data.samples} samples.`;
      } catch (e) {
        status.textContent = "Failed to reach backend. Is it deployed?";
      }
    }

    async function detect(anomalous) {
      const status = document.getElementById("detectStatus");
      const output = document.getElementById("detectOutput");
      status.textContent = "Checking...";
      output.style.display = "none";
      try {
        const res = await fetch(`${API_URL}/detect`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(makeSnapshot(anomalous)),
        });
        const data = await res.json();
        if (data.error) {
          status.textContent = `Error: ${data.error}`;
          return;
        }
        status.innerHTML = data.is_anomaly
          ? `<span class="anomaly">ANOMALY DETECTED</span> (score: ${data.score.toFixed(4)})`
          : `<span class="normal">Normal</span> (score: ${data.score.toFixed(4)})`;
        if (data.alert) {
          output.textContent = data.alert;
          output.style.display = "block";
        }
      } catch (e) {
        status.textContent = "Failed to reach backend.";
      }
    }
  </script>
</body>
</html>
